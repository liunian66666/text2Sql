name: CI

# 只跑离线单元测试：不访问模型端点、不下载数据集、不需要密钥。
# 依赖安装走仓库自带的 uv.lock（默认索引为清华镜像，见 pyproject.toml）。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Byte-compile the package (catches syntax errors early)
        run: uv run python -m compileall -q app runner tests

      - name: Run offline unit tests
        run: uv run python -m unittest discover -s tests -v
