# 10 题基线配置：自托管 qwen 聊天模型 + DashScope 云端向量
# 由 config/template/Qwen3-Coder-30B-A3B-Instruct/config-bird-dev.toml 修改而来

########## Logger configuration ##########
[logger]
print_level = "INFO"

########## Run output configuration ##########
[run]
save_root = "workspace/runs"
exp_name = "bird-dev-baseline-cloud"
parallelism = 8
embedding_batch_size = 64
llm_timeout = 300
progress_log_interval = 20
checkpoint_interval = 1
default_llm_profile = "qwen_http"

########## LLM profiles ##########
[llm_profiles.qwen_http]
model = "qwen"
# OpenAI SDK 会自动在 base_url 后追加 /chat/completions。
base_url = "http://127.0.0.1:1030/v1"
api_key = "EMPTY"
max_tokens = 8192
temperature = 0.7
n_call_strategy = "single"
max_request_n = 8
api_type = "openai"
max_model_len = 65536

########## Embedding: 本地 sentence-transformers（无 API 端点） ##########
[embedding]
api_type = "openai"
embedding_model_name_or_path = "text-embedding-v4"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "YOUR_DASHSCOPE_API_KEY"

[dataset]
type = "bird"
split = "dev"
root_path = "data/bird"
sql_execution_timeout = 600
max_samples = 10

########## Vector database configuration ##########
[vector_database]
api_type = "openai"
embedding_model_name_or_path = "text-embedding-v4"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "YOUR_DASHSCOPE_API_KEY"
max_value_length = 100
lower_meta_data = true
build_backend = "local_index"

[few_shot_index]
save_path = "workspace/runs/_shared/bird/train100-text-embedding-v4"
num_examples = 7
question_weight = 0.6
sql_weight = 0.4
similarity_device = "cpu"
force_rebuild = false
llm_profile = "qwen_http"
max_samples = 100

[few_shot_index.preliminary_sql]
enabled = true
dc_sampling_budget = 8
skeleton_sampling_budget = 8
llm_profile = "qwen_http"

########## Value retrieval configuration ##########
[value_retrieval]
max_values_per_column = 5
backend = "local_index"
local_index_device = "cpu"
llm_profile = "qwen_http"

########## Schema linking configuration ##########
[schema_linking]
direct_linking_sampling_budget = 8
reversed_linking_sampling_budget = 8
value_distance_threshold = 0.05
llm_profile = "qwen_http"

########## SQL generation configuration ##########
[sql_generation]
dc_sampling_budget = 8
skeleton_sampling_budget = 8
icl_sampling_budget = 8
llm_profile = "qwen_http"

########## SQL revision configuration ##########
[sql_revision]
checker_sampling_budget = 8
llm_profile = "qwen_http"

########## SQL selection configuration ##########
[sql_selection]
filter_top_k_sql = 2
evaluator_sampling_budget = 8
shortcut_consistency_score_threshold = 0.6
llm_profile = "qwen_http"

########## LLM extractor configuration ##########
[llm_extractor]
max_retry = 5
