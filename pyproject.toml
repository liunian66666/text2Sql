[project]
name = "enterprise-data-analyst-agent"
version = "0.1.0"
description = "Conversational enterprise data-analysis Agent with RAG-enhanced Text-to-SQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chardet>=5.2.0",
    "chromadb>=1.0.21",
    "db-dtypes>=1.5.0",
    "fastapi>=0.162.0",
    "gdown>=5.2.0",
    "google-cloud-bigquery>=3.40.0",
    "google-cloud-bigquery-storage>=2.36.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "mcp>=2.3.0",
    "modelscope>=1.29.2",
    "nvitop>=1.6.1",
    "openai>=1.107.2",
    "pandas>=2.3.2",
    "pyarrow>=23.0.0",
    "python-dotenv>=1.1.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.1.0",
    "snowflake-connector-python>=4.2.0",
    "tabulate>=0.9.0",
    "tenacity>=9.1.2",
    "tiktoken>=0.11.0",
    "uvicorn>=0.35.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
